services:
  - type: web
    name: super-likes-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: super-likes-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: CONFIG_ENCRYPTION_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
databases:
  - name: super-likes-db
    plan: free
